<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Federal Reserve Game — You run the Fed</title>
    <meta name="description" content="Chair the Federal Reserve in your browser. Set rates, win the FOMC vote, and steer the economy through oil shocks, bank runs and market panics." />
    <meta name="author" content="Hikaru Imai" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#000000" />
    <link rel="canonical" href="%VITE_SITE_URL%" />

    <!-- Icons -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Open Graph (Facebook, LinkedIn, Slack, Discord, iMessage…) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Federal Reserve Game" />
    <meta property="og:title" content="Federal Reserve Game — You run the Fed" />
    <meta property="og:description" content="Set interest rates, win the FOMC vote, and keep the economy alive through oil shocks, bank runs and a feed full of angry posts. A browser game by Hikaru Imai." />
    <meta property="og:url" content="%VITE_SITE_URL%" />
    <meta property="og:image" content="%VITE_SITE_URL%og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Federal Reserve Game: a trading-terminal style dashboard of inflation, jobs, rates and markets, with the tagline “You run the Fed. Keep the economy alive.”" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Federal Reserve Game — You run the Fed" />
    <meta name="twitter:description" content="Set interest rates, win the FOMC vote, and keep the economy alive. A browser game by Hikaru Imai." />
    <meta name="twitter:image" content="%VITE_SITE_URL%og-image.jpg" />
    <meta name="twitter:image:alt" content="Federal Reserve Game: a trading-terminal style dashboard of inflation, jobs, rates and markets." />

    <!-- Structured data for search engines -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "VideoGame",
        "name": "Federal Reserve Game",
        "description": "A browser game where you chair the Federal Reserve: set rates, win the FOMC vote and keep the economy alive.",
        "url": "%VITE_SITE_URL%",
        "image": "%VITE_SITE_URL%og-image.jpg",
        "genre": ["Simulation", "Strategy"],
        "gamePlatform": "Web browser",
        "applicationCategory": "Game",
        "operatingSystem": "Any",
        "inLanguage": "en",
        "author": { "@type": "Person", "name": "Hikaru Imai", "url": "https://my12parsecs.github.io/" }
      }
    </script>

    <!-- Fonts (Boardroom theme) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:wght@400;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />

    <script>
      // Apply the saved theme before first paint (no flash of the wrong theme)
      try {
        if (localStorage.getItem("frb.theme") === "boardroom") {
          document.documentElement.dataset.theme = "boardroom";
          document.querySelector('meta[name="theme-color"]').setAttribute("content", "#e7dcbf");
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <noscript>
      <p style="font-family: sans-serif; padding: 24px">Federal Reserve Game needs JavaScript to run. Please enable it and reload.</p>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
